<!DOCTYPE html>
<html lang="da">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hvad en Volvo</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
	<header>
		<div class="header-inner">
			<div class="logo"><span class="logo-mark"></span>Hvad en Volvo</div>
			<nav class="site-nav" aria-label="Hovednavigation">
				<a href="#forside">Forside</a>
				<a class="primary-link" href="{{ url_for('wiki') }}">Volvo-wiki</a>
			</nav>
		</div>
	</header>

	<main>
		<section class="hero" id="forside">
			<div class="main-content hero-panel">
				<span class="hero-badge">Volvo-fokus</span>
				<h1>Velkommen til Hvad en Volvo</h1>
				<p>En enkel og moderne side om Volvo, biler og alt det, der gør køreturen bedre.</p>
				<div class="hero-actions">
					<a class="button primary" href="#om">Læs mere</a>
					<a class="button secondary" href="{{ url_for('wiki') }}">Gå til wiki</a>
				</div>
			</div>
		</section>

		<section class="main-content cards" id="om">
			<article class="card catalogue" id="bilmodeller">
				<div class="card-icon">V</div>
				<h2>Volvo-modeller</h2>
				<p>Se modeller, farver og de år, hvor de blev solgt.</p>
				<div id="car-list" class="car-list" aria-live="polite">Indlæser bilmodeller...</div>
			</article>
			
		</section>
	</main>

	<footer>
		<div class="footer-inner">&copy; 2024 Hvad en Volvo</div>
	</footer>

	<script>
		async function loadCars() {
			const list = document.getElementById('car-list');
			try {
				const response = await fetch('/api/cars');
				if (!response.ok) throw new Error('Kunne ikke hente bilmodeller');
				const { cars } = await response.json();
				list.innerHTML = cars.map((car) => {
					const modelName = car.name || 'Ukendt model';
					const colors = Array.isArray(car.colors) && car.colors.length ? car.colors.join(', ') : 'Ingen farver registreret';
					const years = Array.isArray(car.years) && car.years.length ? `${car.years[0]}-${car.years[car.years.length - 1]}` : 'Ukendt årgang';
					return `
						<div class="car">
							<strong>${modelName}</strong>
							<span>Farver: ${colors}</span>
							<span>Solgt: ${years}</span>
						</div>
					`;
				}).join('');
			} catch (error) {
				list.textContent = 'Bilmodellerne kunne ikke indlæses lige nu.';
			}
		}

		loadCars();
	</script>
</body>
</html>
